name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-et-tests-unitaires:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Bibliothèque système pour soundfile
        run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - name: Dépendances (sans les moteurs de transcription)
        run: |
          python -m pip install --upgrade pip "setuptools<81"
          grep -vE "^(basic-pitch|torch|piano_transcription_inference)" requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Typage (permissif)
        run: mypy
      - name: Tests unitaires et API
        run: pytest tests/unit tests/integration/test_api.py -m "not integration"
