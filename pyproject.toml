[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "partition-ia"
version = "0.1.0"
description = "Pipeline local de transcription audio piano vers partition (MusicXML, PDF, HTML)."
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Adrien Faure" }]
maintainers = [{ name = "eleven" }]
dependencies = [
    "numpy>=1.23,<2",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "pretty_midi>=0.2.10",
    "music21>=9.1",
    "verovio>=4.0",
    "svglib>=1.5",
    "reportlab>=4.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
engines = [
    "basic-pitch==0.4.0",
    "piano_transcription_inference==0.0.6",
    "torch>=2.0",
    "setuptools<81",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
partition-ia = "partition.cli:main"

[tool.setuptools]
package-dir = { "" = "src", "api" = "api" }
packages = [
    "partition",
    "partition.audio",
    "partition.transcription",
    "partition.postprocess",
    "partition.notation",
    "partition.render",
    "api",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = [
    "integration: tests bout en bout nécessitant les poids ou les dépendances d'un moteur",
    "slow: tests longs (plusieurs dizaines de secondes)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning:resampy.*",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "E501",  # longueur de ligne laissée au formateur
    "B008",  # File(...) / Form(...) en valeur par défaut : idiome FastAPI
    "UP017", # datetime.UTC n'existe pas en Python 3.10
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = ["src/partition", "api"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = true
